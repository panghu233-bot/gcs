name: Deploy GCS website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned vendor build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify vendored JSON parser bundle
        run: |
          npm run vendor:jsonc
          git diff --exit-code -- site/vendor/
      - name: Test save safety and adapters
        run: node --test tests/*.test.cjs
      - name: Validate browser scripts
        run: |
          node --check site/app.js
          node --check site/npc-studio.js
          node --check site/npc-project.js
          node --check site/npc-portrait-writer.js
          node --check site/npc-portrait-controller.js
          node --check site/gdscript-string-patch.js
          node --check site/event-text.js
          node --check site/static-dialogue.js
          node --check site/event-catalog.js
          node --check site/event-performance.js
          node --check site/event-project.js
          node --check site/event-writer.js
          node --check site/event-studio.js
          node --check site/event-flow-contract.js
          node --check site/event-flow.js
          node --check site/event-branches.js
          node --check site/event-flow-view.js
          node --check site/event-flow-layout.js
          node --check site/event-conditions.js
          node --check site/event-reading.js
          node --check site/event-reading-view.js
      - name: Stage current website
        run: |
          mkdir -p _site
          cp -a site/. _site/
          test -f _site/index.html
          diff -qr site _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
